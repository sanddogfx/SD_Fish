name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Loopcast-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Loopcast-0.1.${{ github.run_number }}
          path: Loopcast-*.apk

      - name: Publish to Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Loopcast Fishing 0.1.${{ github.run_number }}
          body: Тестовая сборка. Скачай APK ниже и установи на телефон.
          files: Loopcast-*.apk
          make_latest: true

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            screenshots/
            instrument.log

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          dir=$(mktemp -d)
          if git fetch --depth=1 origin +refs/heads/ci-screenshots:refs/remotes/origin/ci-screenshots; then
            git worktree add --detach "$dir" origin/ci-screenshots
          else
            git worktree add --detach "$dir"
            (cd "$dir" && git checkout -q --orphan screenshots && git rm -rfq .)
          fi
          out="$dir/${{ github.run_number }}"
          mkdir -p "$out"
          cp screenshots/*.png "$out/" 2>/dev/null || true
          cp instrument.log "$out/" 2>/dev/null || true
          cd "$dir"
          git add -A
          git commit -qm "Screenshots for build ${{ github.run_number }}" || exit 0
          # Another build may have pushed in the meantime: put this build's folder on top and retry.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:refs/heads/ci-screenshots && exit 0
            sleep $((attempt * 5))
            git fetch --depth=1 origin +refs/heads/ci-screenshots:refs/remotes/origin/ci-screenshots
            git rebase -q origin/ci-screenshots || { git rebase --abort; exit 1; }
          done
          exit 1
